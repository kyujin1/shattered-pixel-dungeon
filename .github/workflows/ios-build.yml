name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned IPA
        run: |
          chmod +x gradlew
          ./gradlew ios:createIPA -Probovm.iosSkipSigning=true --no-daemon --stacktrace

      - name: Collect IPA
        run: |
          mkdir -p out
          find ios/build -name "*.ipa" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: spd-ios-ipa
          path: out/*.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          files: out/*.ipa
